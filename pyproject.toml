[project]
name = "lumbago-core"
version = "0.2.0"
description = "Foundational accounting library for the Lumbago framework"
readme = "README.md"
authors = [
    { name = "bennett-bernard", email = "bennett.s.bernard@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4,<3",
]

[project.optional-dependencies]
sql = ["sqlalchemy>=2.0.43,<3", "alembic>=1.16,<2"]
postgres = ["lumbago-core[sql]", "psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lumbago"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = ["postgres: requires LUMBAGO_TEST_POSTGRES_URL pointing at a disposable database"]

[tool.coverage.run]
branch = true
source = ["lumbago"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
