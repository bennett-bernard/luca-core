name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: luca_test
          POSTGRES_DB: luca_test
          POSTGRES_PASSWORD: disposable_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U luca_test -d luca_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUCA_TEST_POSTGRES_URL: postgresql+psycopg://luca_test:disposable_ci_password@127.0.0.1:5432/luca_test
    steps:
      # Pinned actions from https://docs.astral.sh/uv/guides/integration/github/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.10"
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras ruff format --check .
      - run: uv run --all-extras mypy src
      - run: uv run --all-extras pytest --cov=luca --cov-branch --cov-fail-under=100
      - run: uv lock --check
      - run: uv build
